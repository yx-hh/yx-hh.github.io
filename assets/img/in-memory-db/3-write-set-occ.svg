<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="760" height="380" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8f547"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ff4c8"/></marker>
  </defs>
  <rect width="760" height="380" fill="#161616"/>

  <!-- Session A -->
  <rect x="24" y="24" width="250" height="150" fill="#1f1f1f" stroke="#3a3a3a"/>
  <text x="38" y="48" fill="#7ff4c8">Session A  (thread 1)</text>
  <text x="38" y="74" fill="#8f8f8f" font-size="12">txStack of write sets</text>
  <rect x="38" y="82" width="222" height="26" fill="#161616" stroke="#3a3a3a"/>
  <text x="48" y="100" fill="#c8f547" font-size="12">L2 { c: "1" }</text>
  <rect x="38" y="112" width="222" height="26" fill="#161616" stroke="#3a3a3a"/>
  <text x="48" y="130" fill="#c8f547" font-size="12">L1 { k1: null (tombstone) }</text>
  <text x="38" y="162" fill="#8f8f8f" font-size="12">readVersions { c: 7 }</text>

  <!-- Session B -->
  <rect x="24" y="200" width="250" height="110" fill="#1f1f1f" stroke="#3a3a3a"/>
  <text x="38" y="224" fill="#7ff4c8">Session B  (thread 2)</text>
  <rect x="38" y="236" width="222" height="26" fill="#161616" stroke="#3a3a3a"/>
  <text x="48" y="254" fill="#c8f547" font-size="12">L1 { c: "1" }</text>
  <text x="38" y="290" fill="#8f8f8f" font-size="12">readVersions { c: 7 }</text>

  <!-- Store -->
  <rect x="470" y="24" width="266" height="286" fill="#1f1f1f" stroke="#7ff4c8"/>
  <text x="484" y="48" fill="#7ff4c8">Store  (committed only)</text>
  <text x="484" y="76" fill="#8f8f8f" font-size="12">one ReadWriteLock guards:</text>
  <text x="484" y="104" fill="#f0ede6">data</text>
  <text x="484" y="128" fill="#f0ede6">valueCounts</text>
  <text x="484" y="152" fill="#f0ede6">versions</text>
  <text x="600" y="152" fill="#c8f547">{ c: 7 → 8 }</text>
  <line x1="484" y1="174" x2="722" y2="174" stroke="#3a3a3a"/>
  <text x="484" y="198" fill="#c8f547">commit(reads, writes)</text>
  <text x="484" y="222" fill="#f0ede6" font-size="12">under write lock:</text>
  <text x="484" y="244" fill="#f0ede6" font-size="12">1. every read version unchanged?</text>
  <text x="484" y="266" fill="#f0ede6" font-size="12">2. yes → apply all, bump version</text>
  <text x="484" y="288" fill="#ff6b6b" font-size="12">   no  → ConflictException</text>

  <!-- arrows -->
  <path d="M274,60 L466,60" stroke="#7ff4c8" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="300" y="52" fill="#7ff4c8" font-size="12">get: miss locally →</text>
  <text x="300" y="80" fill="#7ff4c8" font-size="12">read + record version</text>
  <path d="M274,140 L466,196" stroke="#c8f547" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="318" y="150" fill="#c8f547" font-size="12">outer commit ✓</text>
  <path d="M274,262 L466,262" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="300" y="254" fill="#ff6b6b" font-size="12">commit ✗ (c is now 8)</text>

  <text x="24" y="346" fill="#8f8f8f" font-size="12">Rollback = drop the buffer. Other sessions never see uncommitted data,</text>
  <text x="24" y="364" fill="#8f8f8f" font-size="12">and nothing is ever "restored" over someone else's write.</text>
</svg>
