<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c8f547"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7ff4c8"/></marker>
  </defs>
  <rect width="760" height="400" fill="#161616"/>

  <!-- client -->
  <rect x="24" y="40" width="130" height="50" fill="#1f1f1f" stroke="#3a3a3a"/>
  <text x="89" y="70" fill="#f0ede6" text-anchor="middle">client</text>

  <!-- router / coordinator -->
  <rect x="220" y="30" width="300" height="70" fill="#1f1f1f" stroke="#7ff4c8"/>
  <text x="236" y="56" fill="#7ff4c8">router + txn coordinator</text>
  <text x="236" y="80" fill="#f0ede6" font-size="12">hash(key) → shard, 2PC if &gt;1 shard</text>

  <!-- TSO -->
  <rect x="586" y="30" width="150" height="70" fill="#1f1f1f" stroke="#3a3a3a"/>
  <text x="661" y="58" fill="#f0ede6" text-anchor="middle">timestamp</text>
  <text x="661" y="78" fill="#f0ede6" text-anchor="middle">oracle (TSO)</text>

  <path d="M154,65 L216,65" stroke="#c8f547" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M520,65 L582,65" stroke="#7ff4c8" stroke-width="1.5" marker-end="url(#b)"/>
  <text x="530" y="56" fill="#8f8f8f" font-size="11">ts</text>

  <!-- shards -->
  <g>
    <rect x="24" y="170" width="220" height="150" fill="#1f1f1f" stroke="#3a3a3a"/>
    <text x="38" y="194" fill="#7ff4c8">shard 1</text>
    <rect x="38" y="208" width="192" height="30" fill="#161616" stroke="#c8f547"/>
    <text x="50" y="228" fill="#c8f547" font-size="12">leader</text>
    <rect x="38" y="246" width="92" height="30" fill="#161616" stroke="#3a3a3a"/>
    <text x="48" y="266" fill="#f0ede6" font-size="12">follower</text>
    <rect x="138" y="246" width="92" height="30" fill="#161616" stroke="#3a3a3a"/>
    <text x="148" y="266" fill="#f0ede6" font-size="12">follower</text>
    <text x="38" y="304" fill="#8f8f8f" font-size="12">Raft log, majority ack</text>
  </g>
  <g>
    <rect x="270" y="170" width="220" height="150" fill="#1f1f1f" stroke="#3a3a3a"/>
    <text x="284" y="194" fill="#7ff4c8">shard 2</text>
    <rect x="284" y="208" width="192" height="30" fill="#161616" stroke="#c8f547"/>
    <text x="296" y="228" fill="#c8f547" font-size="12">leader</text>
    <rect x="284" y="246" width="92" height="30" fill="#161616" stroke="#3a3a3a"/>
    <text x="294" y="266" fill="#f0ede6" font-size="12">follower</text>
    <rect x="384" y="246" width="92" height="30" fill="#161616" stroke="#3a3a3a"/>
    <text x="394" y="266" fill="#f0ede6" font-size="12">follower</text>
    <text x="284" y="304" fill="#8f8f8f" font-size="12">Raft log, majority ack</text>
  </g>
  <g>
    <rect x="516" y="170" width="220" height="150" fill="#1f1f1f" stroke="#3a3a3a"/>
    <text x="530" y="194" fill="#7ff4c8">shard 3</text>
    <rect x="530" y="208" width="192" height="30" fill="#161616" stroke="#c8f547"/>
    <text x="542" y="228" fill="#c8f547" font-size="12">leader</text>
    <rect x="530" y="246" width="92" height="30" fill="#161616" stroke="#3a3a3a"/>
    <text x="540" y="266" fill="#f0ede6" font-size="12">follower</text>
    <rect x="630" y="246" width="92" height="30" fill="#161616" stroke="#3a3a3a"/>
    <text x="640" y="266" fill="#f0ede6" font-size="12">follower</text>
    <text x="530" y="304" fill="#8f8f8f" font-size="12">Raft log, majority ack</text>
  </g>

  <!-- coordinator to leaders -->
  <path d="M300,100 L210,166" stroke="#c8f547" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M370,100 L440,166" stroke="#c8f547" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M440,100 L680,166" stroke="#c8f547" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="328" y="150" fill="#c8f547" font-size="12" text-anchor="middle">prepare → commit</text>

  <text x="24" y="356" fill="#8f8f8f" font-size="12">Each shard runs the multi-threaded design locally. The new problems live on the arrows:</text>
  <text x="24" y="376" fill="#8f8f8f" font-size="12">routing, replication, cross-shard atomicity, and a global order for versions.</text>
</svg>
