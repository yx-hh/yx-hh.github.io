---
layout: base
---
<article class="page">
  <a class="back" href="{{ '/blog/' | relative_url }}">← All posts</a>
  <header class="post-header">
    <div class="post-date">{{ page.date | date: "%b %-d, %Y" }}</div>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="post-card-desc">{{ page.description }}</p>{% endif %}
    {% if page.tags.size > 0 %}
    <div class="post-tags">{% for t in page.tags %}<span class="post-tag">{{ t }}</span>{% endfor %}</div>
    {% endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
